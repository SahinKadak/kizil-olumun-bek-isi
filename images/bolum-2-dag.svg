<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#010205"/><stop offset=".55" stop-color="#070912"/><stop offset="1" stop-color="#020306"/>
  </linearGradient>
  <radialGradient id="ominous" cx="53%" cy="24%" r="42%">
    <stop offset="0" stop-color="#a71924" stop-opacity=".30"/><stop offset=".28" stop-color="#68101a" stop-opacity=".17"/><stop offset=".65" stop-color="#28070d" stop-opacity=".07"/><stop offset="1" stop-color="#100207" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="far" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18202c"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <linearGradient id="mainmount" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303744"/><stop offset=".34" stop-color="#141a24"/><stop offset=".72" stop-color="#080b12"/><stop offset="1" stop-color="#020307"/></linearGradient>
  <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f2f1" stop-opacity=".78"/><stop offset=".55" stop-color="#aeb6bf" stop-opacity=".45"/><stop offset="1" stop-color="#69717c" stop-opacity=".08"/></linearGradient>
  <linearGradient id="rededge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c32631" stop-opacity=".45"/><stop offset="1" stop-color="#5b0710" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<rect width="1600" height="1000" fill="url(#ominous)"/>
<!-- subtle ominous glow above the summit -->
<ellipse cx="865" cy="255" rx="310" ry="105" fill="#8f101b" opacity=".10" filter="url(#glow)"/>
<path d="M0 430 C220 350 360 405 520 350 C690 292 810 330 960 285 C1120 238 1320 315 1600 245 L1600 520 L0 520Z" fill="#090b13" opacity=".78"/>
<path d="M0 560 L205 410 L370 535 L545 350 L690 505 L855 330 L1040 505 L1210 390 L1400 520 L1600 390 L1600 760 L0 760Z" fill="url(#far)" opacity=".92"/>
<!-- main mountain -->
<path d="M0 905 L155 760 L300 690 L430 575 L575 655 L690 505 L830 255 L930 395 L1010 525 L1115 430 L1265 610 L1400 700 L1600 815 L1600 1000 L0 1000Z" fill="url(#mainmount)"/>
<!-- summit snow ridges -->
<path d="M830 255 L785 365 L715 485 L670 535 L740 515 L805 445 L850 365 L895 455 L955 500 L1010 525 L950 455 L910 355 L870 295 Z" fill="url(#snow)"/>
<path d="M830 255 L850 365 L805 445 L785 480 L835 430 L875 370 L910 455 L945 475 L910 415 L875 300 Z" fill="#f4f5f4" opacity=".30"/>
<!-- dark gullies -->
<path d="M830 255 L805 445 L745 565 L810 500 L850 405 L875 310Z" fill="#03050a" opacity=".75"/>
<path d="M930 395 L1000 545 L1095 615 L1030 540 L970 430Z" fill="#020408" opacity=".72"/>
<path d="M690 505 L610 650 L525 730 L620 675 L735 545Z" fill="#03050a" opacity=".70"/>
<!-- secondary snowy slopes -->
<path d="M0 905 L155 760 L300 690 L430 575 L370 745 L285 820 L205 875 L130 925Z" fill="#111722"/>
<path d="M1265 610 L1400 700 L1600 815 L1600 920 L1490 850 L1405 790 L1330 720Z" fill="#111722"/>
<path d="M430 575 L520 655 L575 655 L505 705 L445 760 L385 795 L425 700Z" fill="#c7cdd1" opacity=".18"/>
<path d="M1115 430 L1265 610 L1320 700 L1235 640 L1165 565 L1090 500Z" fill="#d8dcde" opacity=".15"/>
<!-- foreground -->
<path d="M0 920 L240 820 L410 875 L580 790 L760 875 L940 780 L1120 860 L1310 790 L1600 900 L1600 1000 L0 1000Z" fill="#020307"/>
<!-- very subtle red atmospheric band -->
<path d="M410 335 C620 270 720 300 855 265 C1010 225 1160 260 1320 320" fill="none" stroke="url(#rededge)" stroke-width="18" opacity=".32" filter="url(#soft)"/>
<!-- stars / snow specks -->
<g fill="#dce0e3" opacity=".32">
 <circle cx="115" cy="145" r="1.7"/><circle cx="250" cy="235" r="1.2"/><circle cx="390" cy="130" r="1.5"/><circle cx="520" cy="205" r="1"/><circle cx="1210" cy="155" r="1.5"/><circle cx="1370" cy="235" r="1.2"/><circle cx="1490" cy="120" r="1.6"/>
</g>
<g stroke="#d7dce0" stroke-linecap="round" opacity=".12">
 <path d="M180 500l18 7"/><path d="M330 410l22 8"/><path d="M1180 520l20 7"/><path d="M1390 450l18 6"/><path d="M1030 700l22 7"/>
</g>
<rect x="10" y="10" width="1580" height="980" rx="2" fill="none" stroke="#7b1019" stroke-opacity=".28"/>
</svg>