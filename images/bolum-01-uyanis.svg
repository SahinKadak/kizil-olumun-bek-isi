  <radialGradient id="glow" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#8d0000" stop-opacity=".34"/><stop offset=".45" stop-color="#420000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151416"/><stop offset="1" stop-color="#030303"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
