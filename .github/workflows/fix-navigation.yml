name: Fix chapter navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix outdated next-chapter labels
        run: |
          sed -i 's/Bölüm 03 — Yakında/Bölüm 03 — İlk Şehir/g' bolum-2.html
          sed -i 's/Bölüm 07 — Yakında/Bölüm 07 — Yolun Ötesi/g' bolum-6.html
          if git diff --quiet; then
            echo "No navigation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bolum-2.html bolum-6.html
          git commit -m "Düzelt bölüm 2 ve 6 sonraki bölüm etiketleri"
          git push
