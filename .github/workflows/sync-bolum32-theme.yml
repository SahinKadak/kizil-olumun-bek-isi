name: Sync Bölüm 32 theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Bölüm 31 dark-red background theme to Bölüm 32
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bolum-32.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          override = "body{background:radial-gradient(circle at 50% 20%,rgba(150,0,0,.13),transparent 30%),#030303!important;color:#eee!important}"
          if override not in s:
              s = s.replace(marker, override + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit theme update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bolum-32.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Match Bölüm 32 background theme to Bölüm 31'
          git push
