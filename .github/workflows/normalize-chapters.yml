name: Normalize Cilt II chapters

on:
  push:
    paths:
      - '.github/workflows/normalize-chapters.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize chapters 26-32
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          chapters = range(26, 33)

          SIDEBAR = '''<aside class="sidebar"><div class="brand"><div class="sigil">✦</div><h1>KIZIL<br>ÖLÜMÜN<br>BEKÇİSİ</h1><div class="author"><span class="author-label">Yazar</span>Şahin Kadak</div></div><nav class="menu"><a href="index.html">⌂ &nbsp; ANA SAYFA</a><a class="active" href="index.html#chapters">▢ &nbsp; BÖLÜMLER</a><a href="index.html#about">◎ &nbsp; DÜNYA</a><a href="index.html#about">♙ &nbsp; KARAKTERLER</a><a href="index.html#about">ⓘ &nbsp; HAKKINDA</a></nav><div class="social">◎　𝕏　✉</div></aside>'''

          CSS = '''
          .layout{min-height:100vh;display:flex}.sidebar{position:fixed;left:0;top:0;bottom:0;width:215px;background:linear-gradient(180deg,#070708,#090708 70%,#050506);border-right:1px solid rgba(170,0,0,.5);display:flex;flex-direction:column;z-index:20}.brand{text-align:center;padding:26px 22px;border-bottom:1px solid rgba(255,255,255,.04)}.sigil{font-size:55px;color:#b40000;text-shadow:0 0 18px rgba(180,0,0,.3);line-height:.8;margin-bottom:20px}.brand h1{font:500 28px/1.03 'Cormorant Garamond',Georgia,serif;color:#fff;margin:0}.author{font:11px Inter,sans-serif;color:#b40000;letter-spacing:.24em;text-transform:uppercase;margin-top:16px}.author-label{display:block;color:#fff;font-size:9px;letter-spacing:.25em;margin-bottom:7px}.menu a{display:block;padding:15px 24px;color:#ddd;text-decoration:none;font:13px Inter,sans-serif;letter-spacing:.04em;border-left:2px solid transparent}.menu a:hover,.menu a.active{color:#fff;background:linear-gradient(90deg,rgba(130,0,0,.22),transparent);border-left-color:#b40000}.social{margin-top:auto;padding:22px;color:#ddd;font:13px Inter,sans-serif}.main{margin-left:215px;width:calc(100% - 215px);min-height:100vh}.reading-bar{margin-left:0}.reader{width:min(calc(100% - 84px),1060px);padding:42px 0 70px}.heading{text-align:left}.heading .kicker{color:#d00000}.heading .number{color:#fff}.heading h1{color:#fff;font:500 68px/.95 'Cormorant Garamond',Georgia,serif;margin:10px 0 0}.accent{margin:27px 0 0}.content,article{font:19px/1.7 'Cormorant Garamond',Georgia,serif;color:#fff}.dialogue{margin:1.15em 0!important;padding:11px 16px!important;border-left:2px solid rgba(255,255,255,.28);background:linear-gradient(90deg,rgba(255,255,255,.035),transparent);color:#fff!important}.dialogue .speaker{display:block;color:#fff;font:600 10px Inter,sans-serif;letter-spacing:.17em;margin-bottom:5px}.dialogue .speech{display:block;color:#fff}.scene-break,.scene{color:#b40000;text-align:center}.nav{margin-top:48px}.nav a{color:#fff}.next{border-color:#b40000!important}
          @media(max-width:950px){.sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid rgba(170,0,0,.5)}.layout{display:block}.main{margin-left:0;width:100%}.menu{display:flex;overflow:auto}.menu a{white-space:nowrap;padding:12px 15px}.social{display:none}.reader{width:min(calc(100% - 44px),1060px)}.heading{text-align:left}.heading h1{font-size:56px}}
          @media(max-width:600px){.reader{width:min(calc(100% - 32px),1060px)}.heading h1{font-size:50px}.content,article{font-size:18px;line-height:1.75}}
          '''

          JS = '''<script>
          (function(){
            const article=document.querySelector('article');
            if(!article) return;
            const ps=[...article.querySelectorAll('p.dialogue')];
            // Convert the chapter-27 dash-only dialogue into the same named-speaker format as the first 25 chapters.
            if(location.pathname.includes('bolum-27')){
              let speaker='Aras';
              ps.forEach(p=>{
                if(/^\s*[—-]/.test(p.textContent)){
                  const text=p.textContent.trim().replace(/^[—-]\s*/,'');
                  p.innerHTML='<span class="speaker">'+speaker+':</span><span class="speech">— '+text+'</span>';
                  speaker=speaker==='Aras'?'Kılavuz':'Aras';
                }
              });
            }
            // Convert separate speaker/speech paragraphs used by some Cilt II files.
            for(let i=0;i<ps.length-1;i++){
              const a=ps[i], b=ps[i+1];
              if(a===b) continue;
              const at=a.textContent.trim();
              const bt=b.textContent.trim();
              if(/^[^—:]{1,40}:$/.test(at) && /^—/.test(bt)){
                const speaker=at.slice(0,-1).trim();
                a.innerHTML='<span class="speaker">'+speaker+':</span><span class="speech">'+bt+'</span>';
                a.className='dialogue';
                b.remove();
              }
            }
            // Normalize inline speaker spans already present.
            article.querySelectorAll('.dialogue').forEach(d=>{
              const sp=d.querySelector('.speaker');
              if(sp) sp.textContent=sp.textContent.replace(/\s*$/,'');
            });
          })();
          </script>'''

          for n in chapters:
              p=Path(f'bolum-{n}.html')
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'class="layout"' in s:
                  continue
              s=s.replace('<body>', '<body><div class="layout">'+SIDEBAR+'<main class="main">', 1)
              s=s.replace('</body>', '</main></div></body>', 1)
              s=s.replace('</style>', CSS+'</style>', 1)
              s=s.replace('</body>', JS+'</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit normalized chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bolum-26.html bolum-27.html bolum-28.html bolum-29.html bolum-30.html bolum-31.html bolum-32.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply first-25 chapter interface to chapters 26-32"
            git push
          fi
